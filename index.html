*{box-sizing:border-box}body{margin:0;background:#f7f3f5;font-family:'Yu Mincho','Hiragino Mincho ProN',serif;color:#2f2930}.wrap{max-width:720px;margin:auto;padding:28px 18px 50px}.controls{background:#fff9;backdrop-filter:blur(10px);border-radius:22px;padding:18px;box-shadow:0 8px 30px #76576a20;margin-bottom:18px}.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.mode{border:1px solid #d9cbd3;background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-size:15px}.mode.on{background:#3d3440;color:white}.draw{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;background:#b7839d;color:white;font-size:17px;font-weight:bold;cursor:pointer}.card{position:relative;aspect-ratio:2/3;border-radius:26px;overflow:hidden;background:#ddd;box-shadow:0 18px 50px #382d3440}.card img{width:100%;height:100%;object-fit:cover;display:block}.message{position:absolute;left:7%;right:7%;top:11%;padding:22px 20px;background:rgba(255,253,249,.90);border-radius:16px;box-shadow:0 8px 25px #0002;text-align:center;font-weight:700;font-size:clamp(21px,4.2vw,31px);line-height:1.65;letter-spacing:.03em}.hint{text-align:center;font-size:13px;color:#776b73;margin-top:12px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;border:1px solid #d7c8d0;background:white;border-radius:12px;padding:11px;cursor:pointer}@media(max-width:500px){.wrap{padding:14px 10px 35px}.controls{padding:14px}.message{top:9%;padding:16px 14px}}
</style></head><body><main class='wrap'><section class='controls'><div style="text-align:center;margin-bottom:14px"><div style="font-size:22px;font-weight:700">今日、noteに何書く？</div><div style="font-size:13px;color:#776b73;margin-top:5px">気分に合わせて、今日のネタを1つ占います。</div></div><div class='modes'><button class='mode' data-mode='one'>一言</button><button class='mode on' data-mode='short'>短め</button><button class='mode' data-mode='long'>長め</button><button class='mode' data-mode='random'>おまかせ</button></div><button id='draw' class='draw'>今日のネタを占う</button></section><section class='card' id='card'><img id='bg' src='images/cover.jpg' alt='表紙'><div class='message' id='message' style='display:none'></div></section><div class='actions'><button id='again'>もう一度</button><button id='copy'>ネタをコピー</button></div><p class='hint'>背景とネタは毎回ランダムに組み合わさります。思いがけないお題との出会いを楽しんでください。</p><p class='hint' style='margin-top:18px'>個人利用向け・登録不要</p></main><script>
const ideas={
oneTerms:["靴下","冷蔵庫","500円","黒歴史","朝","雨","財布","匂い","推し","給料日","失敗","写真","おやつ","秘密","母","父","夫婦","子ども","先生","上司","コンビニ","本屋","スーパー","病院","電車","旅行","給食","宿題","部活","制服","スマホ","手帳","文房具","バッグ","無駄遣い","衝動買い","口ぐせ","勘違い","忘れ物","寝坊","寄り道","苦手なもの","得意なこと","癖","宝物","ご褒美","最近の謎","昔の夢","小さな幸せ","やめたいこと","やめられないこと","買って正解だったもの","買って失敗したもの","今日の愚痴","最近笑ったこと","家族のルール","私だけ？","レシート","玄関","3,000円","昨日","あの人","段ボール","コーヒー","おにぎり","傘","鍵","鏡","枕","夜更かし","早起き","休日","仕事","残業","お土産","誕生日","夏休み","冬","春","秋","夕焼け","月","音楽","本","映画","漫画","美容院","100均","ネット通販","捨てられないもの","昔の写真","初恋","友達","ひとり時間","家族","名前","年齢","夢","運","偶然","大人","子どもの頃"],
shortTopics:["最近ちょっと嬉しかったこと","今日いちばん笑ったこと","最近の小さな失敗","家族の謎ルール","最近の無駄遣い","買ってよかったもの","買って失敗したもの","最近やめたこと","最近始めたこと","今日見た空","今いちばん食べたいもの","最近びっくりしたこと","子どもの頃の勘違い","昔は嫌いだったもの","今は好きになったもの","最近つい検索したこと","最近の小さな贅沢","誰にも伝わらないこだわり","最近気づいた自分の癖","一番古い持ち物","最近の「私だけ？」","予定外に買ってしまったもの","家族に言われた忘れられない一言","最近ちょっと楽になったこと","昔の自分に教えたいこと","今日いちばん平和だった時間","人には理解されにくい好きなもの","大人になったなと思った瞬間","捨てられないもの","頭の中だけで開催した会議","最近ちょっと自慢したいこと","結果的によかった失敗","自分だけのマイルール","値段を見て諦めたもの","家の中で一番好きな場所","子どもの頃に信じていたこと","人にすすめられてよかったもの","やめたいのにやめられないこと","誰かの何気ない一言","誰にも見られなくてよかった瞬間","一年前の自分が驚きそうな今","家族では普通なのに外では違うこと","便利になったなと思うもの","自分の中だけの流行","今いちばん欲しい時間","思っていたのと違ったこと","なぜか覚えている昔の景色","最近の「それ先に言ってよ」","バッグの中の必需品","最近気づいた誰かの優しさ","最近よく使う言葉","歳をとるのも悪くないと思ったこと","最近妙に気になること","戻れるなら戻りたい一日","最近笑ってごまかしたこと","生活からいつの間にか消えたもの","この季節に思い出すこと","最近の推し","今日の自分へのご褒美","最近のモヤモヤ"],
shortFormats:["三行日記にする","三行詩にする","短歌を一首つくる","一枚の画像にする","100文字以内で書く","140文字以内で書く","会話だけで書く","箇条書き3つで書く","タイトルだけ10個考える","写真一枚と一言で表す","歌のタイトルとサビを考える","五・七・五で詠む","誰かへの手紙にする","自分へのメモにする","「あるある」ネタにする","一問一答にする","ランキングBEST3にする","ビフォー・アフターで書く","ひとことエッセイにする","小さな物語にする"],
long:["『あのときは大変だったのに、今では笑える』出来事を、始まりから結末まで書く","自分では当たり前だと思っていたのに、誰かに驚かれた習慣について書く","最近ひとつ買ったものを入口にして、なぜそれを選んだのかまで書く","家族との何気ない会話から、自分でも気づかなかった価値観をひとつ拾って書く","子どもの頃に思い描いていた『大人』と、実際の今の自分を比べて書く","ずっと苦手だったものとの距離が、いつの間にか変わっていた話を書く","最近起きた小さな失敗を、失敗する直前から丁寧に再現して書く","『もう必要ない』と思って手放したものと、その後に起きた変化を書く","今も忘れられない誰かの一言を、その場面ごと思い出して書く","自分の人生で何度も繰り返しているパターンを、笑える具体例と一緒に書く","一日の中で誰にも気づかれなかった自分の頑張りを、今日は主役にして書く","昔好きだったものを久しぶりに見たとき、何が変わり何が変わらなかったかを書く","最近『これって幸せかも』と思った、ごく普通の瞬間を細部まで書く","家にある古いものを一つ選び、それが自分のところへ来た経緯から書く","自分が絶対に譲れない小さなこだわりを、なぜそうなったのかまで掘って書く","最近誰かと意見が違った出来事を、勝ち負けではなく『違い』として書く","予定通りにいかなかった一日を、むしろ予定外だったから起きたこと中心に書く","今の仕事を始めた頃の自分へ、現在の自分から手紙を書く","家族の一人を『知らない人に紹介する』つもりで、特徴的なエピソードを三つ書く","最近心が動いた作品を一つ選び、感想ではなく『自分の何に触れたか』を書く","夜、誰もいない家でなぜか気になってしまう音や場所について、何も起こさずに書く","昔住んでいた場所や通学路など、記憶の中にだけ残っている風景を書く","人生で一度だけ『あの選択でよかった』と思える分岐点を、当時の迷いから書く","今の自分が夢中になっているものを、まったく知らない人にも伝わるように書く","最近、誰かに助けてもらったことと、そのとき言えなかった気持ちを書く","『普通だと思っていた日常が変わった日』を一つ選んで書く","自分の持ち物を一つ主人公にして、それが見てきた自分の数年間を書く","もし今日が小説の一章なら、どんな章だったかを出来事と一緒に書く","最近感じた違和感を一つ選び、答えを出さずにその違和感だけを追って書く","ずっと欲しかったものを手に入れた後、本当に変わったこと・変わらなかったことを書く"]};
let mode='short',last='';const bg=document.getElementById('bg'),msg=document.getElementById('message');
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode});
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function draw(){let m=mode==='random'?pick(['one','short','long']):mode;let idea;if(m==='one'){idea=`「${pick(ideas.oneTerms)}」って、どう思う？`}else if(m==='short'){idea=`「${pick(ideas.shortTopics)}」をテーマに、${pick(ideas.shortFormats)}`}else{idea=pick(ideas.long)}if(idea===last)return draw();last=idea;msg.textContent=idea;msg.style.display='block';bg.src=`images/bg${String(1+Math.floor(Math.random()*21)).padStart(2,'0')}.jpg`;msg.style.fontSize=m==='long'?'clamp(18px,3.4vw,25px)':m==='one'?'clamp(24px,4.8vw,34px)':'clamp(21px,4.2vw,31px)'}
document.getElementById('draw').onclick=draw;document.getElementById('again').onclick=draw;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last||msg.textContent)}catch(e){const ta=document.createElement('textarea');ta.value=last||msg.textContent;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()};let b=document.getElementById('copy'),t=b.textContent;b.textContent='コピーしました';setTimeout(()=>b.textContent=t,1200)};
</script></body></html>
